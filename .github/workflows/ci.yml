# CI pipeline (plan §11.8).
name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  checks:
    name: Codegen, format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build
          flutter gen-l10n
          git diff --exit-code || (echo "::error::Generated files are stale. Run build_runner and gen-l10n, then commit." && exit 1)
      - run: tool/format.sh --check
      - run: flutter analyze --fatal-infos
      # Goldens run in their own job on macOS (pixel output is platform-specific).
      - run: flutter test --exclude-tags golden

  time-zones:
    name: Time tests (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tz:
          - UTC
          - Asia/Baghdad
          - America/New_York
          - Europe/London
          - America/Santiago
          - Australia/Lord_Howe
          - Asia/Kathmandu
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Domain and repository suites (plan §11.3).
      - run: flutter test test/core test/features --exclude-tags golden
        env:
          TZ: ${{ matrix.tz }}

  goldens:
    name: Golden tests (macOS)
    # Goldens are generated on the owner's Apple Silicon Mac; compare on the same platform.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Golden tests
        run: |
          set -o pipefail
          flutter test --tags golden -r expanded 2>&1 | tee golden.log || {
            # Surface each mismatch as an annotation (readable without the raw log).
            grep -E "Pixel test failed|doesn't match|sizes do not match|could not be" golden.log | sort -u | head -20 |
              while read -r line; do echo "::error title=Golden::$line"; done
            exit 1
          }

  android:
    name: Android builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build dev (debug)
        run: flutter build apk --debug --flavor dev
      - name: Throwaway signing key (CI only — never the real release key)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storetype PKCS12 -alias ci \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI" -storepass cipass -keypass cipass
          printf 'storePassword=cipass\nkeyPassword=cipass\nkeyAlias=ci\nstoreFile=%s\n' "$RUNNER_TEMP/ci.jks" > android/key.properties
      - name: Build prod (release)
        run: flutter build apk --release --flavor prod
      - name: Release APK has no INTERNET permission and is 16 KB aligned
        run: tool/check_release_apk.sh build/app/outputs/flutter-apk/app-prod-release.apk
