# Lints: flutter_lints plus stricter rules from plan §8.12.
include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/src/config/localization/l10n/generated/**
    - test/core/database/migrations/generated/**
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Generated-code-only warnings shouldn't fail the build.
    invalid_annotation_target: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - cancel_subscriptions
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters
